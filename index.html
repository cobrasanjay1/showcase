<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        width: 100vw;
        overflow-x: hidden;
    }

    .intro,
    .outro {
        height: 100vh;
        width: 100vw;
        background: #e9e9e9;
        overflow: hidden;
        position: relative;
    }


    .flow {
        height: 100vh;
        background: #1c1c1c;
        position: relative;
        overflow: hidden;
    }

    .flow-images {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        perspective: 2000px;
    }

    .flow .img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 500px;
        height: 350px;
    }

    .flow .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .flow .img.cover {
        width: 100%;
        height: 100%;
        position: relative;
    }

    .flow .img.cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
    }

    /* Section Text Styles */
    .section-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 100;
        text-align: center;
        font-family: 'Raleway', sans-serif;
        pointer-events: none;
    }

    .section-text h1 {
        font-weight: 200;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-bottom: 1rem;
        font-size: clamp(2rem, 8vw, 6rem);
    }

    .section-text p {
        font-weight: 300;
        letter-spacing: 0.15em;
        font-size: clamp(0.75rem, 2vw, 1.2rem);
        opacity: 0.7;
    }

    /* Intro Text */
    .intro .section-text,
    .outro .section-text {
        color: #1c1c1c;
    }

    .intro .section-text h1,
    .outro .section-text h1 {
        background: linear-gradient(135deg, #1c1c1c 0%, #4a4a4a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    /* Flow Text */
    .flow .section-text {
        color: #ffffff;
        font-family: 'Instrument Serif', serif;
        width: 100%;
    }

    .flow .section-text p {
        font-family: 'Instrument Serif', serif;
        font-size: clamp(1.5rem, 5vw, 2rem);
        letter-spacing: 0.05em;
        opacity: 0.8;
    }
</style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"
        integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/lenis@1.3.15/dist/lenis.min.js"></script>

    <script>
        window.addEventListener("load", () => {
            const lenis = new Lenis();
            lenis.on('scroll', ScrollTrigger.update);
            gsap.ticker.add((time) => {
                lenis.raf(time * 1000);
            });
            gsap.ticker.lagSmoothing(0);

            const flow = document.querySelector('.flow');
            const images = gsap.utils.toArray('.flow .img');
            const positions = [
                { x: -0.8, y: -0.6 },
                { x: 0.7, y: 0.4 },
                { x: -0.5, y: 0.7 },
                { x: 0.6, y: -0.5 },
                { x: -0.8, y: 0.2 },
                { x: 0.8, y: -0.3 },
                { x: -0.6, y: -0.8 },
                { x: 0.4, y: 0.6 },
                { x: -0.7, y: 0.5 },
                { x: 0.5, y: -0.7 },
                { x: -0.4, y: -0.4 },
                { x: 0.3, y: 0.8 },
                { x: -0.8, y: 0.3 },
                { x: 0.6, y: 0.2 },
                { x: -0.2, y: -0.7 },
                { x: 0.7, y: -0.6 },
                { x: -0.5, y: 0.4 },
                { x: 0.4, y: -0.4 },
                { x: -0.6, y: 0.6 },
                { x: 0.8, y: 0.5 },
                { x: -0.3, y: -0.5 },
                { x: 0.5, y: 0.3 },
                { x: -0.7, y: -0.2 },
                { x: 0.2, y: 0.7 },
                { x: -0.4, y: 0.8 },
                { x: 0.6, y: -0.8 },
                { x: -0.8, y: 0.1 },
                { x: 0, y: 0 }
            ]

            const screenHeight = window.innerHeight;
            const screenWidth = window.innerWidth;
            const isMobile = screenWidth < 800;
            const spread = isMobile ? 1.5 : 0.7;

            const initPos = Array.from(images.map(() => ({
                x: 0,
                y: 0,
                z: -1000,
                scale: 0
            })));

            const finalPos = Array.from(images.map((img, index) => ({
                x: positions[index].x * screenWidth * spread,
                y: positions[index].y * screenHeight * spread,
                z: 2000,
                scale: 1
            })));


            images.forEach((eachImage, index) => {
                gsap.set(eachImage, initPos[index]);
            });

            ScrollTrigger.create({
                trigger: ".flow",
                start: "top top",
                end: `+=${screenHeight * 10}px`,
                pin: true,
                pinSpacing: true,
                scrub: 1,
                onUpdate: (self) => {
                    const progress = self.progress;

                    images.forEach((eachImage, index) => {
                        const imgDelay = index * 0.03;
                        const imgProgress = Math.max(0, (progress - imgDelay) * 4);

                        const start = initPos[index];
                        const end = finalPos[index];

                        let x = gsap.utils.interpolate(start.x, end.x, imgProgress);
                        let y = gsap.utils.interpolate(start.y, end.y, imgProgress);
                        let z = gsap.utils.interpolate(start.z, end.z, imgProgress);
                        let scale = gsap.utils.interpolate(start.scale, end.scale, imgProgress);
                        if (index === images.length - 1) {
                            x = 0;
                            y = 0;
                            z = z * 0.4
                        }

                        gsap.set(eachImage, { x, y, z, scale });
                    })
                }
            });
        })
    </script>
